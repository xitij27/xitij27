name: Pac-Man
on:
  schedule:
    - cron: "0 2 * * *" # daily, about 3am in Germany
  workflow_dispatch:
  push:
    branches: [main]
    paths: # redraw straight away when this file changes
      - .github/workflows/pacman.yml
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draw Pac-Man eating the contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
