# Redraws the snake that eats the contribution graph on the profile README.
# The pictures go to the "output" branch, which the README links to.
name: Snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
