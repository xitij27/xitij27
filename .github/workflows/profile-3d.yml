name: 3D contributions
on:
  schedule:
    - cron: "0 2 * * *" # daily, about 3am in Germany
  workflow_dispatch:
  push:
    branches: [main]
    paths: # redraw straight away when the look changes
      - .github/workflows/profile-3d.yml
      - assets/3d-contrib.json
      - assets/trim_3d.py
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Draw the 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: assets/3d-contrib.json
      - name: Keep only the calendar and the radar
        run: python3 assets/trim_3d.py profile-3d-contrib/*.svg
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
